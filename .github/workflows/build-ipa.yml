name: Build IPA (巨魔安装版)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    outputs:
      MARKETING_VERSION: ${{ steps.get_version.outputs.MARKETING_VERSION }}
      BUILD_NUM: ${{ steps.get_version.outputs.BUILD_NUM }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📝 记录构建开始时间
        run: echo "BUILD_START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: 🔧 Select Xcode
        run: |
          set -euo pipefail
          ls -1 /Applications | grep '^Xcode' || true
          for xcode in Xcode_16.4.app Xcode_16.3.app Xcode_16.2.app Xcode.app; do
            if [ -d "/Applications/${xcode}/Contents/Developer" ]; then
              sudo xcode-select -s "/Applications/${xcode}/Contents/Developer"
              break
            fi
          done
          xcodebuild -version

      # ===== 缓存优化：CocoaPods / MPV / gem 一次缓存，多次复用 =====
      - name: 💎 Cache Ruby gems (cocoapods / xcodeproj)
        uses: actions/cache@v4
        with:
          path: |
            vendor/bundle
            ~/.gem
            /Library/Ruby/Gems
          key: ${{ runner.os }}-gems-${{ hashFiles('Gemfile', 'Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      - name: 📦 Cache CocoaPods (Pods + Specs Repo)
        uses: actions/cache@v4
        with:
          path: |
            Pods
            Podfile.lock
            ~/.cocoapods/repos
          key: ${{ runner.os }}-pods-${{ hashFiles('Podfile', 'Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: 🎬 Cache MPV dependencies
        uses: actions/cache@v4
        with:
          path: .mpv-cache
          key: ${{ runner.os }}-mpv-${{ hashFiles('scripts/fetch_mpv_dependencies.sh', 'scripts/fetch_mpv_external_dependencies.py') }}
          restore-keys: |
            ${{ runner.os }}-mpv-

      - name: 💎 一次性安装所有 gem (xcodeproj + cocoapods)
        run: |
          set -euo pipefail
          echo "💎 安装 xcodeproj 和 cocoapods..."
          gem install xcodeproj --no-document 2>/dev/null || true
          # cocoapods 由 pod install 步骤处理，这里只确保 xcodeproj 就绪
          echo "✅ gem 安装完成"

      - name: 🚀 Fetch pre-built artifacts in parallel (Go + Python + lxml)
        id: prebuilt_cache
        continue-on-error: true
        run: |
          set +euo pipefail  # 并行下载允许单个失败
          GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          REPO="${{ github.repository }}"

          GO_TAG="quarkproxy-ios-arm64"
          PYTHON_TAG="python-3.14.7-ios-arm64"
          LXML_TAG="lxml-5.4.0-ios-arm64"

          GO_SKIP="false"
          PYTHON_SKIP="false"
          LXML_SKIP="false"

          # ---- 下载函数 ----
          download_go() {
            echo "🐹 [Go] 开始并行下载 Quarkproxy 预编译产物..."
            local URL="https://github.com/${REPO}/releases/download/${GO_TAG}/${GO_TAG}.tar.gz"
            local TARBALL="/tmp/quarkproxy-artifacts.tar.gz"

            if [ -d Quarkproxy.xcframework ]; then
              echo "🐹 [Go] 仓库中已有 Quarkproxy.xcframework，跳过"
              GO_SKIP="true"
              return 0
            fi

            if curl -L --retry 3 --retry-delay 5 --fail \
                 -H "Authorization: token $GITHUB_TOKEN" \
                 -o "$TARBALL" "$URL" 2>/dev/null; then
              tar xzf "$TARBALL" -C . 2>/dev/null
              if [ -d Quarkproxy.xcframework ]; then
                echo "🐹 [Go] 下载成功: $(du -sh Quarkproxy.xcframework | cut -f1)"
                GO_SKIP="true"
              else
                echo "🐹 [Go] 解压后未找到产物"
              fi
              rm -f "$TARBALL"
            else
              echo "🐹 [Go] 下载失败，将现场编译"
            fi
          }

          download_python() {
            echo "🐍 [Python] 开始并行下载 CPython 预编译产物..."
            local URL="https://github.com/${REPO}/releases/download/${PYTHON_TAG}/${PYTHON_TAG}.tar.gz"
            local TARBALL="/tmp/python-artifacts.tar.gz"

            if [ -f vbox/Libraries/python-ios/libpython3.14.a ]; then
              echo "🐍 [Python] 仓库中已有 libpython3.14.a，跳过"
              PYTHON_SKIP="true"
              return 0
            fi

            if curl -L --retry 3 --retry-delay 5 --fail \
                 -H "Authorization: token $GITHUB_TOKEN" \
                 -o "$TARBALL" "$URL" 2>/dev/null; then
              mkdir -p /tmp/python-artifacts
              tar xzf "$TARBALL" -C /tmp/python-artifacts 2>/dev/null

              if [ -d /tmp/python-artifacts/vbox/Libraries/python-ios ]; then
                mkdir -p vbox/Libraries/python-ios vbox/Resources
                cp /tmp/python-artifacts/vbox/Libraries/python-ios/libpython3.14.a vbox/Libraries/python-ios/ 2>/dev/null
                cp -r /tmp/python-artifacts/vbox/Libraries/python-ios/Python.framework vbox/Libraries/python-ios/ 2>/dev/null
                cp -r /tmp/python-artifacts/vbox/Libraries/python-ios/Headers vbox/Libraries/python-ios/ 2>/dev/null
                cp -r /tmp/python-artifacts/vbox/Resources/python-stdlib vbox/Resources/ 2>/dev/null
                echo "🐍 [Python] 下载成功: $(du -sh vbox/Libraries/python-ios/Python.framework 2>/dev/null | cut -f1)"
                PYTHON_SKIP="true"
                rm -rf /tmp/python-artifacts "$TARBALL"
              else
                echo "🐍 [Python] 解压后未找到产物"
              fi
            else
              echo "🐍 [Python] 下载失败，将现场编译"
            fi
          }

          download_lxml() {
            echo "🐍 [lxml] 开始并行下载 lxml 预编译产物..."
            local URL="https://github.com/${REPO}/releases/download/${LXML_TAG}/${LXML_TAG}.tar.gz"
            local TARBALL="/tmp/lxml-artifacts.tar.gz"

            if curl -L --retry 3 --retry-delay 5 --fail \
                 -H "Authorization: token $GITHUB_TOKEN" \
                 -o "$TARBALL" "$URL" 2>/dev/null; then
              mkdir -p /tmp/lxml-artifacts
              tar xzf "$TARBALL" -C /tmp/lxml-artifacts 2>/dev/null
              if [ -d /tmp/lxml-artifacts/lxml ]; then
                echo "🐍 [lxml] 下载成功: $(du -sh /tmp/lxml-artifacts/lxml | cut -f1)"
                LXML_SKIP="true"
              else
                echo "🐍 [lxml] 解压后未找到产物"
              fi
              rm -f "$TARBALL"
            else
              echo "🐍 [lxml] 下载失败，将现场编译"
            fi
          }

          # ---- 并行下载 ----
          echo "🚀 开始并行下载 3 个预编译产物..."
          download_go &
          PID_GO=$!
          download_python &
          PID_PY=$!
          download_lxml &
          PID_LX=$!

          wait $PID_GO $PID_PY $PID_LX
          echo "🚀 并行下载完成"

          # ★ 关键修复: 并行下载在子shell中运行，变量修改不会传播到父shell
          # 必须在 wait 之后重新检查文件是否存在，以正确设置 skip 标志
          if [ -d Quarkproxy.xcframework ]; then GO_SKIP="true"; fi
          if [ -f vbox/Libraries/python-ios/libpython3.14.a ]; then PYTHON_SKIP="true"; fi
          if [ -d /tmp/lxml-artifacts/lxml ]; then LXML_SKIP="true"; fi

          # ---- 输出结果 ----
          echo ""
          echo "=== 下载结果 ==="
          echo "  Go (Quarkproxy):  $([ "$GO_SKIP" = "true" ] && echo '✅ 缓存命中' || echo '⚠️ 需编译')"
          echo "  Python (CPython): $([ "$PYTHON_SKIP" = "true" ] && echo '✅ 缓存命中' || echo '⚠️ 需编译')"
          echo "  lxml:             $([ "$LXML_SKIP" = "true" ] && echo '✅ 缓存命中' || echo '⚠️ 需编译')"
          echo "================"

          echo "go_skip_build=$GO_SKIP" >> $GITHUB_OUTPUT
          echo "python_skip_build=$PYTHON_SKIP" >> $GITHUB_OUTPUT
          echo "lxml_skip_build=$LXML_SKIP" >> $GITHUB_OUTPUT

      - name: 🐹 Setup Go + gomobile + 构建 Quarkproxy.xcframework
        if: steps.prebuilt_cache.outputs.go_skip_build != 'true'
        run: |
          set -euo pipefail
          # 安装 Go
          if ! command -v go &>/dev/null; then
            curl -sL https://go.dev/dl/go1.22.5.darwin-amd64.tar.gz -o /tmp/go.tar.gz
            sudo tar -C /usr/local -xzf /tmp/go.tar.gz
            rm /tmp/go.tar.gz
            echo "/usr/local/go/bin" >> $GITHUB_PATH
          fi
          export PATH="/usr/local/go/bin:$PATH"

          # 防止 Go 自动升级工具链（最新 x/mobile 要求 go 1.26，会导致
          # 自动下载新工具链 + DNS 失败）。锁定为本地安装的 Go 1.22.5。
          export GOTOOLCHAIN=local
          # GOPROXY 多镜像 fallback，避免单一 proxy DNS 故障
          export GOPROXY=https://goproxy.cn,https://proxy.golang.org,direct
          go version

          # 安装 gomobile + gobind（pin 到兼容 Go 1.22 的版本，避免 @latest
          # 拉入要求 go 1.26+ 的新版本）
          # 注意: gomobile init 内部硬编码 gobind@latest，必须预先安装 gobind
          MOBILE_PIN="b38b8813d6076f4e4ff25d71ee2c45f051a3a0cb"
          go install golang.org/x/mobile/cmd/gomobile@${MOBILE_PIN}
          go install golang.org/x/mobile/cmd/gobind@${MOBILE_PIN}
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          export PATH="$(go env GOPATH)/bin:$PATH"

          # 在 go-proxy 模块中添加 golang.org/x/mobile 依赖（gomobile bind 要求）
          # pin 到同一兼容版本，避免 go get @latest 拉入需要 go 1.26 的版本
          cd go-proxy
          go get golang.org/x/mobile@${MOBILE_PIN}
          # go mod tidy 可能因临时 DNS 故障失败，重试 3 次
          for attempt in 1 2 3; do
            if go mod tidy 2>&1; then
              break
            fi
            echo "⚠️ go mod tidy 第 ${attempt} 次失败，重试..."
            [ "$attempt" -lt 3 ] && sleep $((attempt * 5))
          done
          echo "--- go.mod ---"
          cat go.mod

          # 初始化 gomobile（可能需要 Xcode 工具链）
          gomobile init || true

          # 构建 Quarkproxy.xcframework
          gomobile bind -target=ios/arm64 -o ../Quarkproxy.xcframework . 2>&1 || {
            echo "⚠️ arm64 失败，尝试通用 target"
            gomobile bind -target=ios -o ../Quarkproxy.xcframework . 2>&1
          }
          cd ..
          if [ -d Quarkproxy.xcframework ]; then
            echo "✅ Quarkproxy.xcframework 构建成功: $(du -sh Quarkproxy.xcframework | cut -f1)"
          else
            echo "⚠️ Quarkproxy.xcframework 构建失败，将跳过 Go 代理"
          fi

      - name: 🔗 注入 Quarkproxy.xcframework + GoProxyManager.swift 到工程
        run: ruby scripts/configure_quarkproxy_link.rb

      - name: ⬇️ 下载 NodeMobile.xcframework (nodejs-mobile v18.20.4)
        run: |
          set -euo pipefail
          DEST="vbox/Libraries/NodeMobile"
          if [ -d "$DEST/NodeMobile.xcframework" ]; then
            echo "✅ NodeMobile.xcframework 已存在，跳过下载"
            exit 0
          fi
          mkdir -p "$DEST"
          URL="https://github.com/nodejs-mobile/nodejs-mobile/releases/download/v18.20.4/nodejs-mobile-v18.20.4-ios.zip"
          ZIP="/tmp/nodejs-mobile-ios.zip"
          for attempt in 1 2 3; do
            echo "⬇️ 下载 NodeMobile (第 ${attempt}/3 次)..."
            if curl -L --retry 3 --retry-delay 5 --fail -o "$ZIP" "$URL"; then
              break
            fi
            echo "⚠️ 下载失败，重试..."
            [ "$attempt" -lt 3 ] && sleep $((attempt * 10))
          done
          [ -s "$ZIP" ] || { echo "❌ NodeMobile 下载失败"; exit 1; }
          unzip -o "$ZIP" -d /tmp/nodejs-mobile-extract
          # 官方 zip 顶层为 NodeMobile.xcframework（含 ios-arm64 真机 + simulator 双 slice）
          FW=$(find /tmp/nodejs-mobile-extract -maxdepth 1 -type d -name "NodeMobile.xcframework" | head -1)
          [ -z "$FW" ] && { echo "❌ zip 内未找到 NodeMobile.xcframework"; exit 1; }
          cp -R "$FW" "$DEST/"
          echo "✅ NodeMobile.xcframework: $(du -sh $DEST/NodeMobile.xcframework | cut -f1)"
          # 确认真机 arm64 二进制存在
          ls -lh "$DEST/NodeMobile.xcframework/ios-arm64/NodeMobile.framework/NodeMobile"

      - name: 🔗 注入 NodeMobile.xcframework + noderuntime 资源到工程
        run: ruby scripts/configure_noderuntime_link.rb

      - name: 📝 添加 NSAllowsLocalNetworking 到 Info.plist
        run: |
          # 允许 AVPlayer 访问 127.0.0.1 本地代理
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" vbox/Info.plist 2>/dev/null || true
          echo "✅ Info.plist: NSAllowsLocalNetworking 已添加"

      - name: 🐍 Build CPython for iOS arm64 (Python-Apple-support)
        if: steps.prebuilt_cache.outputs.python_skip_build != 'true'
        run: |
          set -euo pipefail

          # ★ 安全检查: 如果预编译产物已下载（子shell变量可能未传播），直接跳过
          if [ -f vbox/Libraries/python-ios/libpython3.14.a ] && [ -d vbox/Libraries/python-ios/Python.framework ]; then
            echo "✅ CPython 预编译产物已存在，跳过现场编译"
            echo "  libpython3.14.a: $(du -h vbox/Libraries/python-ios/libpython3.14.a | cut -f1)"
            echo "  Python.framework: $(du -sh vbox/Libraries/python-ios/Python.framework | cut -f1)"
            exit 0
          fi

          echo "⚠️ 开始现场编译 CPython..."

          # 1. 安装 host Python 3.14 (工具链需要同版本 build-python)
          echo "📦 安装 host Python 3.14..."
          if ! python3.14 --version 2>/dev/null; then
            curl -sLO "https://www.python.org/ftp/python/3.14.7/python-3.14.7-macos11.pkg"
            sudo installer -pkg "python-3.14.7-macos11.pkg" -target / 2>&1 | tail -1
          fi
          export PATH="/Library/Frameworks/Python.framework/Versions/3.14/bin:$PATH"
          python3.14 --version

          # 2. Clone Python-Apple-support 工具链
          echo "📥 Clone Python-Apple-support (3.14 branch)..."
          rm -rf /tmp/pas
          # ★ 必须使用 3.14 分支，main 分支已升级到 3.15.0rc2
          git clone --depth 1 --branch 3.14 https://github.com/beeware/Python-Apple-support.git /tmp/pas
          cd /tmp/pas

          # 3. 构建 iOS device Python (自动处理 OpenSSL/libffi/bz2/xz 依赖)
          echo "🏗️ 构建 iOS arm64 Python (完整 iOS 流程)..."
          export PATH="/Library/Frameworks/Python.framework/Versions/3.14/bin:$PATH"
          make iOS 2>&1 | tee /tmp/pas-build.log | tail -30

          # 4. 检查产物 (动态检测 Python 版本目录名，避免版本升级后路径不匹配)
          echo "📦 检查产物..."
          PY_VER_DIR=$(find install -maxdepth 4 -type d -name "python-3.14.*" | grep -v simulator | head -1 | xargs basename 2>/dev/null)
          if [ -z "$PY_VER_DIR" ]; then
            PY_VER_DIR="python-3.14.7"
          fi
          echo "  检测到 Python 版本目录: $PY_VER_DIR"
          INSTALL_DIR="install/ios/iphoneos.arm64/${PY_VER_DIR}"
          if [ ! -f "${INSTALL_DIR}/Python.framework/Python" ]; then
            INSTALL_DIR="install/iOS/iphoneos.arm64/${PY_VER_DIR}"
          fi
          if [ ! -f "${INSTALL_DIR}/Python.framework/Python" ]; then
            echo "❌ Python.framework 未生成"
            echo "install 目录结构:"
            find install -name "Python" -path "*framework*" 2>/dev/null | head
            echo "--- 日志末尾 ---"
            tail -80 /tmp/pas-build.log
            exit 1
          fi
          echo "✅ Python framework 生成:"
          ls -lh "${INSTALL_DIR}/Python.framework/Python"
          echo "  标准库路径: ${INSTALL_DIR}/lib/python3.14"
          echo "  头文件: ${INSTALL_DIR}/Python.framework/Headers"

          # 5. 复制产物到 vbox 项目
          echo "📤 复制到 vbox 项目..."
          cd "${GITHUB_WORKSPACE}"
          mkdir -p vbox/Libraries/python-ios

          # 复制整个 Python.framework (含二进制 + Headers)
          rm -rf vbox/Libraries/python-ios/Python.framework
          cp -r /tmp/pas/${INSTALL_DIR}/Python.framework vbox/Libraries/python-ios/Python.framework

          # 兼容: 也单独放 libpython3.14.a
          rm -f vbox/Libraries/python-ios/libpython3.14.a
          cp /tmp/pas/${INSTALL_DIR}/Python.framework/Python vbox/Libraries/python-ios/libpython3.14.a

          # 头文件: 建 Headers/ + Headers/Python/ 双布局, 支持 <Python/Python.h> 和 "Python.h"
          rm -rf vbox/Libraries/python-ios/Headers
          mkdir -p vbox/Libraries/python-ios/Headers/Python
          cp -r /tmp/pas/${INSTALL_DIR}/Python.framework/Headers/* vbox/Libraries/python-ios/Headers/
          cp /tmp/pas/${INSTALL_DIR}/Python.framework/Headers/Python.h vbox/Libraries/python-ios/Headers/Python/Python.h 2>/dev/null || true
          find /tmp/pas/${INSTALL_DIR}/Python.framework/Headers -maxdepth 1 -type f ! -name "Python.h" -exec cp {} vbox/Libraries/python-ios/Headers/Python/ \; 2>/dev/null || true

          echo "✅ CPython 集成完成"
          echo "  libpython3.14.a: $(du -h vbox/Libraries/python-ios/libpython3.14.a | cut -f1)"
          echo "  Python.framework: $(du -sh vbox/Libraries/python-ios/Python.framework | cut -f1)"
          echo "  Headers: $(ls vbox/Libraries/python-ios/Headers/Python.h 2>/dev/null && echo OK)"

      - name: 🎬 Fetch MPVKit dependencies
        run: |
          bash scripts/fetch_mpv_dependencies.sh --cache-dir .mpv-cache
          python3 scripts/fetch_mpv_external_dependencies.py --all --cache-dir .mpv-cache/external
          python3 scripts/check_mpv_installed_dependencies.py

      - name: 🔗 Inject MPVKit Link & Embed
        run: ruby scripts/configure_mpvkit_link.rb

      - name: 🔧 修复 PushPlayView/PushPlayStore 路径 (mpvkit脚本后)
        run: python3 scripts/fix_pushplay_pbxproj.py

      - name: 🔢 自动递增版本号
        run: |
          # 读取当前版本号
          CURRENT_VERSION=$(plutil -extract CFBundleShortVersionString raw vbox/Info.plist)
          CURRENT_BUILD=$(plutil -extract CFBundleVersion raw vbox/Info.plist)
          echo "当前版本: $CURRENT_VERSION (build $CURRENT_BUILD)"

          # 解析版本号: 3.335 -> 3.336
          MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
          MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f2)
          NEW_MINOR=$((MINOR + 1))
          NEW_VERSION="$MAJOR.$NEW_MINOR"
          NEW_BUILD=$((CURRENT_BUILD + 1))

          echo "新版本: $NEW_VERSION (build $NEW_BUILD)"

          # 更新 Info.plist
          plutil -replace CFBundleShortVersionString -string "$NEW_VERSION" vbox/Info.plist
          plutil -replace CFBundleVersion -string "$NEW_BUILD" vbox/Info.plist

          # 更新 project.pbxproj
          sed -i '' "s/MARKETING_VERSION = $CURRENT_VERSION;/MARKETING_VERSION = $NEW_VERSION;/g" vbox.xcodeproj/project.pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION = $CURRENT_BUILD;/CURRENT_PROJECT_VERSION = $NEW_BUILD;/g" vbox.xcodeproj/project.pbxproj

          # 更新 .version 文件
          echo "MAJOR_VERSION=$MAJOR" > .version
          echo "BASE_BUILD=$NEW_BUILD" >> .version

          # 提交版本号更新
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vbox/Info.plist vbox.xcodeproj/project.pbxproj .version
          git commit -m "ci: auto bump version to $NEW_VERSION (build $NEW_BUILD)" || true
          git push origin main || true

      - name: 📖 获取版本号
        id: get_version
        run: |
          MARKETING_VERSION=$(plutil -extract CFBundleShortVersionString raw vbox/Info.plist)
          BUILD_NUM=$(plutil -extract CFBundleVersion raw vbox/Info.plist)
          echo "MARKETING_VERSION=$MARKETING_VERSION" >> $GITHUB_OUTPUT
          echo "BUILD_NUM=$BUILD_NUM" >> $GITHUB_OUTPUT
          echo "Version: $MARKETING_VERSION Build: $BUILD_NUM"

      - name: 📦 Install CocoaPods dependencies
        run: |
          set -euo pipefail
          # 安装 cocoapods (已缓存则很快)
          if ! command -v pod &>/dev/null; then
            sudo gem install cocoapods --no-document
          fi
          pod --version

          # 判断是否缓存命中：Pods 存在且 Podfile.lock 未变
          USE_REPO_UPDATE="--repo-update"
          if [ -d Pods ] && [ -f Podfile.lock ]; then
            echo "📦 Pods 缓存命中，跳过 repo-update 加速安装"
            USE_REPO_UPDATE=""
          else
            echo "📦 Pods 缓存未命中，执行完整 repo-update"
          fi

          # MobileVLCKit 的下载服务器 download.videolan.org 经常超时，需要重试
          for attempt in 1 2 3 4 5; do
            echo "📦 第 ${attempt}/5 次尝试 pod install ${USE_REPO_UPDATE}"
            if pod install $USE_REPO_UPDATE; then
              echo "✅ CocoaPods 安装成功"
              exit 0
            fi
            echo "⚠️ pod install 失败，清理后重试..."
            rm -rf Pods Podfile.lock
            pod cache clean --all 2>/dev/null || true
            USE_REPO_UPDATE="--repo-update"  # 失败重试时强制 repo-update
            if [ "$attempt" -lt 5 ]; then
              sleep $((attempt * 15))
            fi
          done
          echo "❌ pod install 多次重试后仍失败"
          exit 1

      - name: 🔧 修复 PushPlayView/PushPlayStore 路径 (pod install 后)
        run: python3 scripts/fix_pushplay_pbxproj.py

      - name: 🐍 注入 Python.framework 链接到 pbxproj
        run: |
          set -o pipefail
          ruby scripts/configure_python_link.rb

      - name: 🐍 精简 Python 标准库 (232MB → ~15MB)
        run: |
          set -o pipefail
          echo "🐍 精简 Python 标准库..."
          STD="vbox/Resources/python-stdlib"

          # 0. 如果标准库已从 Release 下载，跳过复制步骤
          if [ -d "$STD/lib/python3.14" ]; then
            echo "✅ 标准库已存在 (从 Release 下载)，跳过复制步骤"
          else

          # 1. 从 CPython 构建产物复制标准库到 Resources
          #    关键: 必须匹配真机 iphoneos.arm64 (排除 iphonesimulator)
          #    且保留 python3.14 层 → 最终路径须为 python-stdlib/lib/python3.14/
          PAS_LIB=$(find /tmp/pas/install -path "*/iphoneos.arm64/python-3.14.*/lib/python3.14" -type d 2>/dev/null | head -1)
          if [ -z "$PAS_LIB" ]; then
            echo "⚠️ 未找到真机标准库，尝试通用匹配但排除 simulator"
            PAS_LIB=$(find /tmp/pas/install -path "*/python-3.14.*/lib/python3.14" -type d 2>/dev/null | grep -v simulator | head -1)
          fi
          if [ -n "$PAS_LIB" ] && [ -d "$PAS_LIB" ]; then
            echo "源标准库(真机): $PAS_LIB ($(du -sh $PAS_LIB | cut -f1))"
            rm -rf "$STD"
            # 明确: 复制为 $STD/lib/python3.14   (保留 python3.14 层)
            mkdir -p "$STD/lib"
            cp -r "$PAS_LIB" "$STD/lib/"   # → $STD/lib/python3.14
            echo "✅ 标准库已复制至: $STD/lib/python3.14"
            # 校验非 simulator
            if find "$STD/lib" -name "*.so" 2>/dev/null | head -1 | grep -q simulator; then
              echo "❌ 仍含 simulator .so, 出错!"
              find "$STD/lib" -name "*.so" 2>/dev/null | head -1
              exit 1
            fi
          fi

          fi  # end of "if stdlib already downloaded"

          # 如果已经有了就直接用
          if [ ! -d "$STD" ] || [ -z "$(ls -A $STD 2>/dev/null)" ]; then
            echo "⚠️ 未找到标准库源，跳过精简"
            exit 0
          fi
          echo "精简前: $(du -sh $STD | cut -f1)"

          # 2. 只删确定无用的大目录, 其余 .py 标准库全保留(避免缺模块)
          #    保留: os.py/time.py/importlib/re/urllib 等所有标准库
          #    site-packages 保留(后续 requests/bs4 用)
          for del in test unittest idlelib tkinter lib2to3 \
                     config-* wsgiref turtledemo xmlrpc \
                     ensurepip distutils pip venv \
                     *test*; do
            find "$STD" -path "*/$del" -exec rm -rf {} + 2>/dev/null
          done
          echo "📦 标准库 .py (保留后): $(find "$STD" -name '*.py' 2>/dev/null | wc -l) 个"

          # 3. 保留全部真机版 .so C 扩展 (不删除, 避免漏 _sre/_datetime/_locale 等)
          #    仅确保没有 simulator 版混入
          if [ -d "$STD/lib/python3.14/lib-dynload" ]; then
            sims=$(find "$STD/lib/python3.14/lib-dynload" -name "*simulator*" 2>/dev/null)
            if [ -n "$sims" ]; then
              echo "⚠️ 发现 simulator .so, 移除: $sims"
              echo "$sims" | xargs rm -f 2>/dev/null
            fi
            echo "📦 lib-dynload 保留 .so 数: $(ls "$STD/lib/python3.14/lib-dynload"/*.so 2>/dev/null | wc -l)"
          fi

          # 4. 删 pyc
          find "$STD" -name "*.pyc" -delete 2>/dev/null
          find "$STD" -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null

          # 5. 恢复 base.spider 兼容模块
          #    从 repo 的 scripts/python-base-spider.py 复制 (不在 python-stdlib 下, 不会被 rm 删)
          #    双重部署：lib/python3.14/base/ 和顶层 base/，确保两处都是 regular package
          #    （都有 __init__.py），避免 namespace package 优先级问题导致加载旧版
          if [ -f "scripts/python-base-spider.py" ]; then
            LIBDIR="$STD/lib/python3.14"
            [ -d "$LIBDIR" ] || LIBDIR="$STD/lib"
            [ -d "$LIBDIR" ] || LIBDIR="$STD"
            # 部署到 lib/python3.14/base/（标准库路径）
            mkdir -p "$LIBDIR/base"
            cp "scripts/python-base-spider.py" "$LIBDIR/base/spider.py"
            touch "$LIBDIR/base/__init__.py"
            echo "✅ 恢复 base/spider.py → $LIBDIR/base/spider.py"
            # 同时部署到顶层 base/（PYTHONPATH 路径，双保险）
            mkdir -p "$STD/base"
            cp "scripts/python-base-spider.py" "$STD/base/spider.py"
            touch "$STD/base/__init__.py"
            echo "✅ 恢复 base/spider.py → $STD/base/spider.py (双保险)"
            ls -la "$LIBDIR/base/"
            ls -la "$STD/base/"
          else
            echo "⚠️ 未找到 scripts/python-base-spider.py"
          fi

          echo "精简后: $(du -sh $STD | cut -f1)"

      - name: 🐍 安装 site-packages (requests/bs4 纯Python库)
        run: |
          set -euo pipefail
          echo "🐍 安装 requests/bs4/pyaes 到 site-packages..."
          STD="vbox/Resources/python-stdlib"
          SITE_PKG="$STD/site-packages"
          mkdir -p "$SITE_PKG"

          # 使用兼容的 Python 3 来安装纯 Python 库
          # 优先用构建 CPython 时安装的 host python3.14
          HOST_PY=""
          for p in /Library/Frameworks/Python.framework/Versions/3.14/bin/python3.14 python3.14 python3; do
            if command -v "$p" >/dev/null 2>&1; then HOST_PY="$p"; break; fi
          done
          echo "使用 host python: ${HOST_PY:-python3}"
          PY="${HOST_PY:-python3}"

          # 安装纯 Python 库 (无 C 扩展, iOS 可用) — 加 --no-deps 避免拉入编译版
          $PY -m pip install --no-deps --target "$SITE_PKG" \
            requests \
            beautifulsoup4 \
            urllib3 \
            certifi \
            idna \
            charset-normalizer \
            soupsieve \
            typing_extensions \
            pyaes \
            --quiet 2>&1 | tail -5 || echo "⚠️ 部分包安装失败, 但继续"

          # 清理 .pyc / dist-info 中的二进制(可选)
          find "$SITE_PKG" -name "*.pyc" -delete 2>/dev/null || true
          find "$SITE_PKG" -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          # 移除可能误装的 .so (C扩展, iOS 不能用)
          find "$SITE_PKG" -name "*.so" -delete 2>/dev/null || true

          # ★ 安装 Crypto 兼容层 (pyaes + pycryptodome API 兼容)
          # 让脚本的 from Crypto.Cipher import AES 自动走纯 Python 实现
          # 同时安装 ARC4 / Padding / RSA / PKCS1_v1_5，支持星空4K / 新韩剧网 / 臻彩4K 等脚本
          echo "🐍 安装 Crypto 兼容层 (pycryptodome API 兼容)..."
          mkdir -p "$SITE_PKG/Crypto/Cipher" "$SITE_PKG/Crypto/PublicKey" "$SITE_PKG/Crypto/Util"
          cp scripts/Crypto/__init__.py "$SITE_PKG/Crypto/"
          cp scripts/Crypto/Cipher/__init__.py "$SITE_PKG/Crypto/Cipher/"
          cp scripts/Crypto/Cipher/AES.py "$SITE_PKG/Crypto/Cipher/"
          cp scripts/Crypto/Cipher/ARC4.py "$SITE_PKG/Crypto/Cipher/"
          cp scripts/Crypto/Cipher/PKCS1_v1_5.py "$SITE_PKG/Crypto/Cipher/"
          cp scripts/Crypto/PublicKey/__init__.py "$SITE_PKG/Crypto/PublicKey/"
          cp scripts/Crypto/PublicKey/RSA.py "$SITE_PKG/Crypto/PublicKey/"
          cp scripts/Crypto/Util/__init__.py "$SITE_PKG/Crypto/Util/"
          cp scripts/Crypto/Util/Padding.py "$SITE_PKG/Crypto/Util/"
          echo "📦 Crypto 兼容层文件:"
          find "$SITE_PKG/Crypto" -name "*.py" -type f

          echo "📦 site-packages 内容:"
          ls "$SITE_PKG" 2>/dev/null | head -20
          echo "site-packages 大小: $(du -sh $SITE_PKG 2>/dev/null | cut -f1)"

      - name: 🐍 交叉编译 lxml 并安装到 site-packages
        if: steps.prebuilt_cache.outputs.lxml_skip_build != 'true'
        run: |
          set -euo pipefail
          echo "🐍 开始 lxml iOS arm64 交叉编译..."

          # 运行交叉编译脚本
          bash scripts/build_lxml_ios.sh

          # 验证编译产物
          LXML_OUTPUT="/tmp/lxml-build/output/lxml"
          if [ ! -d "$LXML_OUTPUT" ]; then
            echo "❌ lxml 编译产物未找到: $LXML_OUTPUT"
            exit 1
          fi
          echo "✅ lxml 编译完成: $(du -sh $LXML_OUTPUT | cut -f1)"

      - name: 🐍 安装 lxml 到 site-packages (预编译或现场编译)
        run: |
          set -euo pipefail
          STD="vbox/Resources/python-stdlib"
          SITE_PKG="$STD/site-packages"
          mkdir -p "$SITE_PKG"

          # 确定 lxml 源目录 (预编译下载的 或 现场编译的)
          LXML_SRC=""
          if [ -d /tmp/lxml-artifacts/lxml ]; then
            LXML_SRC="/tmp/lxml-artifacts/lxml"
            echo "🐍 使用预编译 lxml 产物"
          elif [ -d /tmp/lxml-build/output/lxml ]; then
            LXML_SRC="/tmp/lxml-build/output/lxml"
            echo "🐍 使用现场编译 lxml 产物"
          fi

          if [ -z "$LXML_SRC" ]; then
            echo "❌ 未找到 lxml 编译产物"
            exit 1
          fi

          echo "📦 安装 lxml 到 site-packages..."
          rm -rf "$SITE_PKG/lxml"
          cp -r "$LXML_SRC" "$SITE_PKG/lxml"

          # 验证安装
          echo "🔍 验证 lxml 安装..."
          echo "   lxml 目录结构:"
          find "$SITE_PKG/lxml" -type f 2>/dev/null | head -20 || true
          echo ""
          echo "   .so 文件:"
          find "$SITE_PKG/lxml" -name "*.so" -type f | while read -r f; do
            ARCH=$(file "$f" | grep -o 'arm64\|x86_64' | head -1)
            echo "   $f ($ARCH)"
          done
          echo ""
          echo "   site-packages 大小: $(du -sh $SITE_PKG | cut -f1)"
          echo "✅ lxml 安装完成"

      - name: 📦 Upload lxml artifacts to Release (首次编译时)
        if: steps.prebuilt_cache.outputs.lxml_skip_build != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LXML_TAG="lxml-5.4.0-ios-arm64"
          LXML_OUTPUT="/tmp/lxml-build/output/lxml"

          if [ ! -d "$LXML_OUTPUT" ]; then
            echo "⚠️ 未找到 lxml 编译产物，跳过上传"
            exit 0
          fi

          echo "📦 打包 lxml 产物..."
          cd /tmp/lxml-build/output
          tar czf "/tmp/${LXML_TAG}.tar.gz" lxml
          cd "${GITHUB_WORKSPACE}"
          sha256sum "/tmp/${LXML_TAG}.tar.gz" > "/tmp/${LXML_TAG}.tar.gz.sha256"

          echo "📤 上传到 GitHub Release..."
          gh release delete "$LXML_TAG" --yes 2>/dev/null || true
          gh release create "$LXML_TAG" \
            "/tmp/${LXML_TAG}.tar.gz" \
            "/tmp/${LXML_TAG}.tar.gz.sha256" \
            --title "lxml 5.4.0 iOS arm64 (预编译产物)" \
            --notes "lxml 5.4.0 交叉编译产物 (iphoneos.arm64)

          包含:
          - lxml Python 包 (含 .so C 扩展)
          - 依赖 libxml2 2.13.5, libxslt 1.1.42 (静态链接)

          用于 CI 加速: 下载后直接安装到 site-packages，跳过 2-3 分钟的交叉编译。
          lxml 版本升级时需重新生成。"
          echo "✅ lxml 产物已上传到 Release: ${LXML_TAG}"

      - name: 📦 Upload CPython artifacts to Release (首次编译时)
        if: steps.prebuilt_cache.outputs.python_skip_build != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PYTHON_TAG="python-3.14.7-ios-arm64"

          echo "📦 打包 CPython 产物..."
          bash scripts/pack_python_artifacts.sh /tmp

          echo "📤 上传到 GitHub Release..."
          # 删除旧 Release (如果存在)
          gh release delete "$PYTHON_TAG" --yes 2>/dev/null || true
          # 创建新 Release 并上传产物
          gh release create "$PYTHON_TAG" \
            "/tmp/${PYTHON_TAG}.tar.gz" \
            "/tmp/${PYTHON_TAG}.tar.gz.sha256" \
            --title "CPython 3.14.7 iOS arm64 (预编译产物)" \
            --notes "CPython 3.14.7 交叉编译产物 (iphoneos.arm64)

          包含:
          - libpython3.14.a (~5.6MB)
          - Python.framework (~8.2MB)
          - Headers (Python.h 等)
          - 精简后标准库 (~15MB, 含 base/spider.py)

          用于 CI 加速: 下载解压后跳过 6 分钟的 make iOS 编译。
          Python 版本升级时需重新生成。"
          echo "✅ 产物已上传到 Release: ${PYTHON_TAG}"

      - name: 🏗️ Clean
        run: |
          set -o pipefail
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          rm -rf ~/Library/Caches/org.llvm.clang/*
          xcodebuild -workspace vbox.xcworkspace -scheme vbox \
            -configuration Release \
            -destination generic/platform=iOS \
            clean 2>&1

      - name: 🏗️ Build
        run: |
          set -o pipefail
          BUILD_CMD="xcodebuild -workspace vbox.xcworkspace -scheme vbox"
          $BUILD_CMD \
            -sdk iphoneos \
            -configuration Release \
            -arch arm64 \
            -derivedDataPath ./Build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            PRODUCT_BUNDLE_IDENTIFIER=com.vbox.iosplayer \
            MARKETING_VERSION=${{ steps.get_version.outputs.MARKETING_VERSION }} \
            CURRENT_PROJECT_VERSION=${{ steps.get_version.outputs.BUILD_NUM }} \
            build 2>&1

      - name: 📦 Package IPA
        run: |
          APP=$(find ./Build -name "vbox.app" -type d | head -1)
          [ -z "$APP" ] && echo "No .app!" && exit 1
          rm -rf "$APP/_CodeSignature" "$APP/archived-expanded-entitlements.xcent" 2>/dev/null
          [ ! -f "$APP/vbox" ] && echo "No vbox!" && exit 1
          MPVKIT_FRAMEWORK="$APP/Frameworks/MPVKit.framework"
          if [ -f "$MPVKIT_FRAMEWORK/MPVKit" ] && [ ! -f "$MPVKIT_FRAMEWORK/MPVKitWrapper" ]; then
            echo "修复 MPVKit install name 文件名不一致：复制 MPVKit -> MPVKitWrapper"
            cp "$MPVKIT_FRAMEWORK/MPVKit" "$MPVKIT_FRAMEWORK/MPVKitWrapper"
          fi
          if [ -d "$MPVKIT_FRAMEWORK" ]; then
            echo "MPVKit.framework 内容："
            ls -la "$MPVKIT_FRAMEWORK"
          fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r vbox.ipa Payload/
          echo "IPA: $(ls -lh vbox.ipa)"

      - name: 📝 生成 Release Notes
        id: release_notes
        run: |
          VERSION="${{ steps.get_version.outputs.MARKETING_VERSION }}"
          BUILD="${{ steps.get_version.outputs.BUILD_NUM }}"

          PREVIOUS_TAG=$(git tag --sort=-creatordate | head -1)

          NOTES=""

          if [ -n "$PREVIOUS_TAG" ]; then
            RAW_COMMITS=$(git log "$PREVIOUS_TAG"..HEAD --pretty=format:"%s" --no-merges 2>/dev/null | \
              grep -v "^ci: auto bump" | \
              grep -v "^docs: 自动更新" | \
              grep -v "^docs: 新增 CHANGELOG" || true)
          else
            RAW_COMMITS=$(git log -30 --pretty=format:"%s" --no-merges 2>/dev/null | \
              grep -v "^ci: auto bump" | \
              grep -v "^docs: 自动更新" | \
              grep -v "^docs: 新增 CHANGELOG" || true)
          fi

          if [ -n "$RAW_COMMITS" ]; then
            FEAT_ITEMS=$(echo "$RAW_COMMITS" | grep -iE "^feat" | sed -E 's/^[[:space:]]*(feat|feature)[[:space:]]*:[[:space:]]*//I' || true)
            FIX_ITEMS=$(echo "$RAW_COMMITS" | grep -iE "^fix" | sed -E 's/^[[:space:]]*fix[[:space:]]*:[[:space:]]*//I' || true)
            OTHER_ITEMS=$(echo "$RAW_COMMITS" | grep -viE "^(feat|feature|fix)" | head -20 || true)

            NOTES="## 修复\n\n"
            if [ -n "$FIX_ITEMS" ]; then
              echo "$FIX_ITEMS" | awk '{print "- "$0}' >> /tmp/notes_fix.txt
              NOTES+=$(cat /tmp/notes_fix.txt)
              NOTES+="\n"
            else
              NOTES+="_无_\n"
            fi

            NOTES+="\n## 新增\n\n"
            if [ -n "$FEAT_ITEMS" ]; then
              echo "$FEAT_ITEMS" | awk '{print "- "$0}' >> /tmp/notes_feat.txt
              NOTES+=$(cat /tmp/notes_feat.txt)
              NOTES+="\n"
            else
              NOTES+="_无_\n"
            fi

            if [ -n "$OTHER_ITEMS" ]; then
              NOTES+="\n## 其他变更\n\n"
              echo "$OTHER_ITEMS" | awk '{print "- "$0}' >> /tmp/notes_other.txt
              NOTES+=$(cat /tmp/notes_other.txt)
              NOTES+="\n"
            fi
          fi

          if [ -z "$NOTES" ]; then
            NOTES="版本 v$VERSION (build $BUILD)"
          fi

          echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
          echo -e "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo -e "$NOTES" > release_notes.txt
          echo "=== 生成 Release Notes ==="
          cat release_notes.txt

      - name: 📤 Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: vbox-ipa
          path: vbox.ipa
          compression-level: 0

      - name: 📤 Upload Release Notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.txt

      - name: 🚀 Release to A Repo
        run: |
          VERSION="v${{ steps.get_version.outputs.MARKETING_VERSION }}"
          echo "🚀 创建 A 仓库 Release: $VERSION"
          for attempt in 1 2 3 4 5; do
            echo "第 ${attempt}/5 次尝试创建 Release"
            gh release delete "$VERSION" --yes 2>/dev/null || true
            if gh release create "$VERSION" \
              --title "$VERSION" \
              --notes-file release_notes.txt \
              vbox.ipa; then
              echo "✅ A 仓库 Release 创建成功"
              exit 0
            fi
            echo "⚠️ A 仓库 Release 创建失败，可能是 GitHub 临时 5xx 或上传接口异常"
            if [ "$attempt" -lt 5 ]; then
              sleep $((attempt * 30))
            fi
          done
          echo "❌ A 仓库 Release 多次重试后仍失败"
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 📧 发送邮件通知
        if: always() && !cancelled()
        continue-on-error: true
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          JOB_STATUS: ${{ job.status }}
          MARKETING_VERSION: ${{ steps.get_version.outputs.MARKETING_VERSION }}
          BUILD_NUM: ${{ steps.get_version.outputs.BUILD_NUM }}
        run: python3 scripts/send_build_notification.py

  sync-b-repo:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download IPA
        uses: actions/download-artifact@v4
        with:
          name: vbox-ipa
          path: ./vbox-ipa

      - name: 📥 Download Release Notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: ./release-notes

      - name: 🚀 Sync Release to B Repo
        env:
          B_REPO_TOKEN: ${{ secrets.B_REPO_TOKEN }}
          B_REPO_OWNER: ${{ secrets.B_REPO_OWNER }}
          B_REPO_NAME: ${{ secrets.B_REPO_NAME }}
        run: |
          set -x

          echo "=== B_REPO_TOKEN 是否配置: $(if [ -n "$B_REPO_TOKEN" ]; then echo 'YES (长度:'${#B_REPO_TOKEN}')'; else echo 'NO'; fi) ==="
          echo "=== B_REPO_OWNER: '${B_REPO_OWNER}' ==="
          echo "=== B_REPO_NAME: '${B_REPO_NAME}' ==="

          if [ -z "$B_REPO_TOKEN" ] || [ -z "$B_REPO_OWNER" ] || [ -z "$B_REPO_NAME" ]; then
            echo "⚠️ B 仓库 Secret 未配置，跳过同步"
            echo "请在仓库 Settings > Secrets and variables > Actions 中配置:"
            echo "  - B_REPO_TOKEN (需要 repo 权限的 Personal Access Token)"
            echo "  - B_REPO_OWNER (B仓库所有者)"
            echo "  - B_REPO_NAME (B仓库名称)"
            echo "注意：Secrets 必须配置在 Repository 级别，不是 Environment 级别"
            exit 0
          fi

          echo "🔍 验证 Token 权限..."
          echo "$B_REPO_TOKEN" | gh auth login --with-token --hostname github.com 2>&1 || true
          gh auth status 2>&1 || true
          if ! GH_TOKEN="$B_REPO_TOKEN" gh repo view $B_REPO_OWNER/$B_REPO_NAME --json name,owner 2>&1; then
            echo "❌ 无法访问 B 仓库 $B_REPO_OWNER/$B_REPO_NAME"
            exit 1
          fi

          IPA_PATH=$(find ./vbox-ipa -name "*.ipa" -type f | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "❌ 未找到 IPA 文件"
            ls -la ./vbox-ipa/
            exit 1
          fi
          echo "✅ IPA: $IPA_PATH"

          VERSION="v${{ needs.build.outputs.MARKETING_VERSION }}"
          echo "同步版本: $VERSION"

          B_REPO_EMPTY=$(gh repo view $B_REPO_OWNER/$B_REPO_NAME --json isEmpty -q '.isEmpty' 2>/dev/null || echo "true")
          echo "B_REPO_EMPTY=$B_REPO_EMPTY"
          if [ "$B_REPO_EMPTY" = "true" ]; then
            echo "📦 B 仓库为空，初始化..."
            gh repo clone $B_REPO_OWNER/$B_REPO_NAME /tmp/b-repo 2>&1 || true
            if [ -d "/tmp/b-repo/.git" ]; then
              cd /tmp/b-repo
              echo "# vbox-release" > README.md
              git add . && git commit -m "init" && git push origin main
              cd -
            fi
            rm -rf /tmp/b-repo
          fi

          echo "🗑️ 删除旧 Release..."
          GH_TOKEN="$B_REPO_TOKEN" gh release delete "$VERSION" --yes --repo $B_REPO_OWNER/$B_REPO_NAME 2>&1 || echo "旧 Release 不存在"

          NOTES_FILE=$(find ./release-notes -name "release_notes.txt" -type f | head -1)
          if [ -z "$NOTES_FILE" ]; then
            echo "⚠️ 未找到 release_notes.txt，使用默认说明"
            NOTES_FILE=""
          else
            echo "✅ Release Notes: $NOTES_FILE"
          fi

          echo "🚀 创建 Release $VERSION..."
          for attempt in 1 2 3 4 5; do
            echo "第 ${attempt}/5 次尝试创建 B 仓库 Release"
            if [ -n "$NOTES_FILE" ]; then
              if GH_TOKEN="$B_REPO_TOKEN" gh release create "$VERSION" \
                --repo $B_REPO_OWNER/$B_REPO_NAME \
                --title "$VERSION" \
                --notes-file "$NOTES_FILE" \
                "$IPA_PATH"; then
                echo "✅ B 仓库 Release 创建成功"
                echo "✅ 同步完成"
                exit 0
              fi
            else
              if GH_TOKEN="$B_REPO_TOKEN" gh release create "$VERSION" \
                --repo $B_REPO_OWNER/$B_REPO_NAME \
                --title "$VERSION" \
                --notes "版本 $VERSION" \
                "$IPA_PATH"; then
                echo "✅ B 仓库 Release 创建成功"
                echo "✅ 同步完成"
                exit 0
              fi
            fi
            echo "⚠️ B 仓库 Release 创建失败，可能是 GitHub 临时 5xx 或上传接口异常"
            if [ "$attempt" -lt 5 ]; then
              sleep $((attempt * 30))
            fi
          done
          echo "❌ B 仓库 Release 多次重试后仍失败"
          exit 1
